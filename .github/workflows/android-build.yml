name: INSERCODE - Compilacion Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar INSERCODE
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autorizar Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Comprobar APK
        if: success()
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK de prueba
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INSERCODE-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
